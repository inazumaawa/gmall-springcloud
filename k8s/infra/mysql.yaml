# ============================================================
# MySQL —— 基础组件，不纳入 CI/CD 流水线（无源码、无 Dockerfile，属运维动作）
# 数据位置：NFS 192.168.10.16:/opt/gpmall/nfsdata/mysql（Retain，删 Pod 不丢数据）
# 手动重建：kubectl apply -f k8s/infra/mysql.yaml
# ============================================================
# mysql-pv.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    path: /opt/gpmall/nfsdata/mysql
    server: 192.168.10.16

---
# mysql-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: my-springcloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs

---
# mysql-svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: my-springcloud
spec:
  type: NodePort
  ports:
  - port: 3306
    targetPort: 3306
    nodePort: 30306
  selector:
    app: mysql

---
# mysql-development.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: my-springcloud
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - image: registry.cn-hangzhou.aliyuncs.com/ptuxzx202180/mysql:8.0.26
        name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: ctx139308993
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
