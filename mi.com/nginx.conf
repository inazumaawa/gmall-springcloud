server {
    listen       80;
    server_name  localhost;

    # 静态资源（html/js/css/图片等）
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html; # Vue History 模式
    }

    # API 代理到 Gateway
    location /auth      { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /goods     { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /cart      { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /order     { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /address   { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /coupon    { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /review    { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /favorite  { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /usercenter{ proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /admin     { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /alipay    { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /ai        { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /obs       { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /chat      { proxy_pass http://gateway-svc.my-springcloud:8080; }
    location /ws        {
        proxy_pass http://gateway-svc.my-springcloud:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
